# Read-only: what the token can see (permissions, Pages, Instagram accounts). Never prints the token. Run by hand.
name: diagnose
on:
  workflow_dispatch:
    inputs: { mode: { description: 'publish (default) or recent', required: false } }
permissions: { contents: read }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - env: { IG_ACCESS_TOKEN: '${{ secrets.IG_ACCESS_TOKEN }}', IG_USER_ID: '${{ secrets.IG_USER_ID }}' }
        run: python -m ig.diagnose ${{ inputs.mode || 'publish' }}
