# The dashboard as a website (GitHub Pages): rebuilt after every make, post, analytics or comments run, and on changes.
# The "Making" and comments parts are live on their own (the page reads them from the repo).
name: pages
on:
  push: { branches: [main], paths: ['queue/**', 'posted/**', 'reports/**', 'maker/made.json', 'maker/*.md', 'maker/watch.json', 'dashboard/**', 'comments/**'] }
  workflow_run: { workflows: [make, publish, insights, learn], types: [completed] }
  schedule: [{ cron: '0 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write, actions: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    env: { GH_TOKEN: '${{ github.token }}', PYTHONIOENCODING: utf-8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Videos made on GitHub (the media release)
        run: mkdir -p _site/v && (gh release download media --pattern '*.mp4' --dir _site/v --clobber || true) && ls _site/v
      - run: python dashboard/build.py --site _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
