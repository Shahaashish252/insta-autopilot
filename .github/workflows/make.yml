# Makes the next reel by itself, twice a day: fresh numbers → best posting time → Claude writes a new word's script →
# voice, music, picture (studio/) → the video goes to the "media" release → queue/<slug>/post.json, approved, at the
# next best slot. publish.yml posts it then. Skips itself while 3 approved reels are already waiting (MAX_AHEAD).
# Run workflow by hand: make one now (optionally your own word, e.g. "मन → मान").
name: make
on:
  schedule:
    - cron: '30 23 * * *'   # 05:00 IST
    - cron: '30 8 * * *'    # 14:00 IST
  workflow_dispatch:
    inputs:
      word: { description: 'optional word change, e.g. मन → मान (empty: Claude picks)', required: false }
      force: { description: 'make one even if reels are already waiting', type: boolean, default: false }
      test: { description: 'test only: render the example reel, no Claude, nothing queued', type: boolean, default: false }
permissions: { contents: write }
concurrency: { group: instagram, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
      AUTO_APPROVE: '1'
      POSTS_PER_DAY: '2'
      PY: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: studio/requirements.txt }
      - name: Live progress for the dashboard
        run: python -m maker.progress start
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Tools (ffmpeg, renderer, Claude Code)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r studio/requirements.txt
          cd studio && npm install --silent && node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell > /dev/null
          npm install -g -s @anthropic-ai/claude-code
          python -m maker.progress setup done "ffmpeg, renderer, Claude Code"
      - name: Speech-check model cache
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-v1 }
      - name: Fresh numbers and the best time
        run: |
          python -m maker.progress numbers running
          python -m ig.insights || echo "(insights failed; using the last report)"
          python -m ig.best_time | tee /tmp/best.txt
          python -m maker.progress numbers done "$(head -1 /tmp/best.txt)"
      - name: Make the reel
        env: { WORD: '${{ inputs.word }}', FORCE: '${{ inputs.force }}', TEST: '${{ inputs.test }}' }
        run: |
          if [ "$TEST" = true ]; then python -u -m maker.make --spec studio/films/_template/spec.example.json --no-queue; python -m maker.progress finish done "test render (not queued)"; exit; fi
          python -u -m maker.make ${WORD:+--word "$WORD"} $( [ "$FORCE" = true ] && echo --force )
      - name: Test video
        if: inputs.test
        uses: actions/upload-artifact@v4
        with: { name: test-reel, path: 'studio/films/*/*.mp4', retention-days: 3 }
      - name: Mark a failure on the dashboard
        if: failure() || cancelled()
        run: python -m maker.progress fail "the run stopped; see its log"
      - name: Save
        if: always()
        run: |
          git config user.name insta-autopilot; git config user.email actions@users.noreply.github.com
          git add -A queue maker reports
          git diff --cached --quiet || { git commit -m "make: $(ls -t queue | head -1)"; git pull --rebase -q; git push; }
