# Posts approved queue items when they are due. Runs every 30 minutes; posting itself is decided by each post.json.
name: publish
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
    inputs:
      now: { description: 'post this approved queue item immediately (folder name)', required: false }
permissions: { contents: write }
concurrency: { group: instagram, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Post what is due
        env: { IG_ACCESS_TOKEN: '${{ secrets.IG_ACCESS_TOKEN }}', IG_USER_ID: '${{ secrets.IG_USER_ID }}', NOW: '${{ inputs.now }}' }
        run: python -m ig.publish ${NOW:+--now "$NOW"}
      - name: Record it
        run: |
          git config user.name insta-autopilot; git config user.email actions@users.noreply.github.com
          git add -A queue posted
          git diff --cached --quiet || { git commit -m "posted: $(ls posted | tail -1)"; git push; }
