# Posts approved queue items when they are due (slots chosen by ig/best_time.py from the channel's numbers). Wakes every
# 20 minutes at odd minutes, because GitHub delays or drops scheduled runs at busy times (:00, :30). One reel per run; a
# reel already on Instagram (posted by hand) is marked posted, never posted twice; one missed by over 2 h gets a new slot.
name: publish
on:
  schedule: [{ cron: '7,27,47 * * * *' }]
  workflow_dispatch:
    inputs:
      now: { description: 'post this approved queue item immediately (folder name)', required: false }
permissions: { contents: write }
concurrency: { group: instagram, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Post what is due
        env: { IG_ACCESS_TOKEN: '${{ secrets.IG_ACCESS_TOKEN }}', IG_USER_ID: '${{ secrets.IG_USER_ID }}', NOW: '${{ inputs.now }}', GH_TOKEN: '${{ github.token }}' }
        run: python -m ig.publish ${NOW:+--now "$NOW"}
      - name: Record it
        run: |
          git config user.name insta-autopilot; git config user.email actions@users.noreply.github.com
          git add -A queue posted
          git diff --cached --quiet || { git commit -m "posted: $(ls -t posted | head -1)"; git pull --rebase -q; git push; }
